<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>通路管理工具入口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 專業又活潑，主管一進來就知道要點哪裡
   IDEA: 一排彩色的「工具卡匣」，每個工具有自己的顏色與圖示
   PICTURE: 卡片本身；每張卡頂端是彩色色塊加大圖示
   COLOUR and TYPE: 預設繽紛多彩，可切換 5 種風格；Noto Sans TC
   LAYOUT: 頂部問候＋風格切換，卡片格線／清單兩種排列，手機單欄 */
:root{color-scheme:light;
  --bg:#f6f7fb;--ink:#14161c;--mute:#5d6270;--card:#fff;--line:#e4e6ee;--soft:#eef0f6;
  --hero:linear-gradient(120deg,#ff5a5f 0%,#ff9f1c 35%,#2ec4b6 70%,#3a86ff 100%);--heroInk:#fff;
  --mono:0}
/* 風格：單一主色時，所有卡片共用 --acc */
[data-skin=blue]{--bg:#f3f6fb;--hero:linear-gradient(120deg,#0b3d91,#1f6fe5);--acc:#1f6fe5;--mono:1}
[data-skin=mint]{--bg:#f2faf7;--hero:linear-gradient(120deg,#0f766e,#22c39a);--acc:#0f9f7f;--mono:1}
[data-skin=sun]{--bg:#fff8f1;--hero:linear-gradient(120deg,#e85d04,#ffb703);--acc:#e85d04;--mono:1}
[data-skin=ttl]{--bg:#fbf6f6;--hero:linear-gradient(120deg,#8b0f1a,#d7263d);--acc:#c1121f;--mono:1}
[data-skin=night]{color-scheme:dark;--bg:#0f1117;--ink:#eef0f6;--mute:#9aa1b2;--card:#181b24;--line:#2a2f3c;--soft:#222633;
  --hero:linear-gradient(120deg,#3a0ca3,#7209b7 45%,#f72585);--mono:0}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip;transition:background .3s}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}

/* Hero */
.hero{background:var(--hero);color:var(--heroInk);position:relative;overflow:hidden}
.hero .wrap{padding-top:clamp(28px,4vw,52px);padding-bottom:clamp(60px,6vw,84px);position:relative}
.hero svg.deco{position:absolute;right:-40px;top:-30px;width:min(420px,60vw);opacity:.22;pointer-events:none}
.hi{font-size:15px;font-weight:500;opacity:.92;margin:0}
h1{font-size:clamp(32px,5vw,50px);line-height:1.08;margin:6px 0 10px;font-weight:900;text-wrap:balance}
.sub{margin:0;max-width:60ch;opacity:.92}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stats span{background:rgba(255,255,255,.2);backdrop-filter:blur(4px);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:500}

/* Toolbar */
.bar{margin-top:-36px;position:relative;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.grp>label{font-size:13px;color:var(--mute);font-weight:500;margin-right:2px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);outline:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{outline:3px solid var(--ink)}
.sw:focus-visible,.seg button:focus-visible,.btn:focus-visible,#q:focus-visible{outline:3px solid #3a86ff;outline-offset:2px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--ink);font:500 14px "Noto Sans TC",sans-serif;padding:0 12px;min-height:38px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15);font-weight:700}
#q{flex:1 1 200px;min-height:42px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:0 14px;font:16px "Noto Sans TC",sans-serif}

/* Cards */
main{padding:24px 0 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.card{--c:var(--acc,#3a86ff);background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 36px -18px color-mix(in srgb,var(--c) 70%,transparent)}
.top{background:color-mix(in srgb,var(--c) 14%,var(--card));height:132px;position:relative;display:flex;align-items:center;justify-content:center;border-bottom:4px solid var(--c)}
.top svg{width:96px;height:96px;color:var(--c)}
.top .no{position:absolute;left:16px;top:12px;font-size:12px;font-weight:700;color:var(--c);background:var(--card);padding:2px 10px;border-radius:99px}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{font-size:21px;line-height:1.3;margin:0;font-weight:900}
.body p{margin:0;color:var(--mute);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--soft)}
.acts{margin-top:auto;padding-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.btn{flex:1 1 120px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 14px;border-radius:12px;text-decoration:none;font-weight:700;font-size:15px;background:var(--c);color:#fff;white-space:nowrap;transition:filter .2s}
.btn.alt{background:transparent;color:var(--c);border:2px solid var(--c)}
.btn:hover{filter:brightness(1.08)}
.btn svg{width:18px;height:18px;flex:none}

/* List layout */
.list .grid{grid-template-columns:1fr;gap:12px}
.list .card{flex-direction:row;align-items:stretch}
.list .top{width:110px;height:auto;flex:none;border-bottom:0;border-right:4px solid var(--c)}
.list .top svg{width:56px;height:56px}.list .top .no{display:none}
.list .body{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:14px 18px}
.list .txt{flex:1 1 260px}
.list .acts{margin:0;padding:0;flex:0 1 300px}
.list .chips{display:none}
@media(max-width:600px){.list .top{width:72px}.list .top svg{width:40px;height:40px}}

.empty{padding:40px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:16px}
footer{color:var(--mute);font-size:13px;padding:0 0 32px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <svg class="deco" viewBox="0 0 200 200" aria-hidden="true"><circle cx="140" cy="60" r="60" fill="#fff"/><circle cx="60" cy="150" r="34" fill="#fff"/><rect x="120" y="130" width="60" height="60" rx="14" fill="#fff"/></svg>
    <p class="hi" id="hi">您好</p>
    <h1>通路管理工具入口</h1>
    <p class="sub">戰情、巡補、人力、地圖、督導，一頁全部到齊。點選按鈕即可另開新分頁查看。</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="wrap">
  <div class="bar">
    <div class="grp" role="group" aria-label="風格">
      <label>風格</label>
      <button class="sw" data-s="fun"   title="繽紛活力" aria-label="繽紛活力" style="background:conic-gradient(#ff5a5f,#ff9f1c,#2ec4b6,#3a86ff,#ff5a5f)"></button>
      <button class="sw" data-s="blue"  title="專業藍"   aria-label="專業藍"   style="background:#1f6fe5"></button>
      <button class="sw" data-s="mint"  title="清新綠"   aria-label="清新綠"   style="background:#0f9f7f"></button>
      <button class="sw" data-s="sun"   title="暖陽橘"   aria-label="暖陽橘"   style="background:#e85d04"></button>
      <button class="sw" data-s="ttl"   title="台酒紅"   aria-label="台酒紅"   style="background:#c1121f"></button>
      <button class="sw" data-s="night" title="夜間模式" aria-label="夜間模式" style="background:linear-gradient(135deg,#0f1117 50%,#7209b7 50%)"></button>
    </div>
    <div class="grp">
      <label>排列</label>
      <div class="seg" id="lay"><button data-v="grid">卡片</button><button data-v="list">清單</button></div>
    </div>
    <div class="grp">
      <label>版本</label>
      <div class="seg" id="ver"><button data-v="all">全部</button><button data-v="m">有手機版</button></div>
    </div>
    <input id="q" type="search" placeholder="搜尋工具，例如：勞役比、地圖" aria-label="搜尋工具">
  </div>

  <main id="main"><div class="grid" id="grid"></div></main>
  <footer>更新日期：2026-11-24　｜　風格與排列設定會記在這台裝置上</footer>
</div>

<script>
{
  const I = {
    chart:`<svg viewBox="0 0 120 120"><rect x="14" y="98" width="92" height="5" rx="2.5" fill="currentColor" opacity=".25"/><rect x="22" y="62" width="16" height="36" rx="4" fill="currentColor" opacity=".35"/><rect x="44" y="42" width="16" height="56" rx="4" fill="currentColor" opacity=".55"/><rect x="66" y="52" width="16" height="46" rx="4" fill="currentColor" opacity=".35"/><rect x="88" y="22" width="16" height="76" rx="4" fill="currentColor"/><path d="M26 50 L52 30 L74 40 L96 12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    shelf:`<svg viewBox="0 0 120 120"><rect x="16" y="18" width="88" height="84" rx="8" fill="none" stroke="currentColor" stroke-width="5" opacity=".45"/><rect x="16" y="56" width="88" height="5" fill="currentColor" opacity=".45"/><rect x="26" y="30" width="12" height="26" rx="3" fill="currentColor" opacity=".45"/><rect x="42" y="34" width="12" height="22" rx="3" fill="currentColor" opacity=".45"/><rect x="58" y="28" width="12" height="28" rx="3" fill="currentColor"/><rect x="26" y="70" width="14" height="28" rx="3" fill="currentColor" opacity=".35"/><rect x="44" y="74" width="14" height="24" rx="3" fill="currentColor" opacity=".35"/><circle cx="86" cy="82" r="14" fill="currentColor"/><path d="M79 82 l5 5 l9 -9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    people:`<svg viewBox="0 0 120 120"><circle cx="40" cy="40" r="13" fill="currentColor" opacity=".45"/><path d="M16 86 a24 24 0 0 1 48 0 z" fill="currentColor" opacity=".45"/><circle cx="78" cy="36" r="15" fill="currentColor"/><path d="M50 90 a28 28 0 0 1 56 0 z" fill="currentColor"/><rect x="14" y="98" width="92" height="5" rx="2.5" fill="currentColor" opacity=".25"/></svg>`,
    map:`<svg viewBox="0 0 120 120"><path d="M14 30 L44 20 L76 30 L106 20 L106 92 L76 102 L44 92 L14 102 Z" fill="currentColor" opacity=".18"/><path d="M44 20 L44 92 M76 30 L76 102" stroke="currentColor" stroke-width="4" opacity=".35"/><circle cx="30" cy="70" r="6" fill="currentColor" opacity=".5"/><circle cx="92" cy="78" r="6" fill="currentColor" opacity=".5"/><path d="M60 84 C60 84 38 60 38 46 a22 22 0 0 1 44 0 C82 60 60 84 60 84 Z" fill="currentColor"/><circle cx="60" cy="46" r="8" fill="#fff"/></svg>`,
    audit:`<svg viewBox="0 0 120 120"><rect x="26" y="16" width="68" height="90" rx="10" fill="currentColor" opacity=".2"/><rect x="44" y="10" width="32" height="16" rx="6" fill="currentColor"/><g fill="currentColor"><rect x="40" y="42" width="10" height="10" rx="3"/><rect x="40" y="62" width="10" height="10" rx="3"/><rect x="40" y="82" width="10" height="10" rx="3" opacity=".4"/></g><g fill="currentColor" opacity=".45"><rect x="56" y="44" width="26" height="6" rx="3"/><rect x="56" y="64" width="26" height="6" rx="3"/><rect x="56" y="84" width="20" height="6" rx="3"/></g></svg>`
  };
  const V = {
    web:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>`,
    m:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg>`
  };

  // ▼ 要新增工具：照格式複製一筆即可（type: web=網頁版、m=手機版）
  const tools = [
    { title:'傳統通路戰情表', desc:'傳統通路業務戰情，掌握促案與陳列執行進度。', icon:'chart', color:'#ff5a5f',
      chips:['店家查詢','菸架購貨','啤酒五大陳列','酒特陳架','全品項業績'],
      links:[{type:'web', url:'https://yiamanda94.github.io/NBCRTI/'}] },
    { title:'全聯A級點每週巡補回報', desc:'全聯 A 級門市每週巡補拜訪與照片回報。', icon:'shelf', color:'#ff9f1c',
      chips:['全聯','A級點','每週回報'],
      links:[{type:'web', url:'https://yiamanda94.github.io/PX-A-Wkly-Visit-Rpt/'}] },
    { title:'人力配置 × 勞役比分析', desc:'各營業所人力配置與勞役比分析（主管檢視）。', icon:'people', color:'#8338ec',
      chips:['人力配置','勞役比','營業所'],
      links:[{type:'web', url:'https://yiamanda94.github.io/staffing-report/'}] },
    { title:'通路分布地圖', desc:'北部營業處店家分布，可依通路、地區、駐點、品項篩選。', icon:'map', color:'#2ec4b6',
      chips:['通路','地區','駐點','品項'],
      links:[{type:'m', url:'https://bright-licorice-3c5ece.netlify.app/'}] },
    { title:'啤酒陳列督導追蹤', desc:'主管五大陳列督導與課長每月陳列查核進度追蹤。', icon:'audit', color:'#3a86ff',
      chips:['五大陳列','主任督導','課長查核'],
      links:[{type:'web', url:'https://yiamanda94.github.io/supervisor-check/display-audit.html'},
             {type:'m',   url:'https://yiamanda94.github.io/supervisor-check/display-audit-m.html'}] }
  ];

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const root = document.documentElement, grid = document.getElementById('grid'), main = document.getElementById('main');
  const store = { get:k=>{try{return localStorage.getItem('portal-'+k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem('portal-'+k,v)}catch(e){}} };
  const st = { skin: store.get('skin')||'fun', lay: store.get('lay')||'grid', ver:'all', q:'' };

  const h = new Date().getHours();
  document.getElementById('hi').textContent = (h<11?'早安':h<14?'午安':h<18?'午安':'晚安') + '，歡迎使用';
  const nM = tools.filter(t=>t.links.some(l=>l.type==='m')).length;
  document.getElementById('stats').innerHTML = `<span>共 ${tools.length} 項工具</span><span>${nM} 項有手機版</span><span>點了另開新分頁</span>`;

  const render = () => {
    const q = st.q.trim().toLowerCase();
    const list = tools.filter(t =>
      (st.ver==='all' || t.links.some(l=>l.type==='m')) &&
      (!q || (t.title+t.desc+t.chips.join('')).toLowerCase().includes(q)));
    const mono = getComputedStyle(root).getPropertyValue('--mono').trim()==='1';
    grid.innerHTML = list.length ? list.map((t,i) => `
      <article class="card" style="${mono?'':'--c:'+t.color}">
        <div class="top" aria-hidden="true"><span class="no">工具 ${tools.indexOf(t)+1}</span>${I[t.icon]}</div>
        <div class="body">
          <div class="txt"><h2>${esc(t.title)}</h2><p>${esc(t.desc)}</p></div>
          <div class="chips">${t.chips.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
          <div class="acts">${t.links.map((l,j)=>`<a class="btn${j?' alt':''}" href="${esc(l.url)}" target="_blank" rel="noopener">${V[l.type]}${l.type==='m'?'手機版':'網頁版'}</a>`).join('')}</div>
        </div>
      </article>`).join('') : `<div class="empty">找不到符合的工具，換個關鍵字試試。</div>`;
  };

  const apply = () => {
    if (st.skin==='fun') root.removeAttribute('data-skin'); else root.setAttribute('data-skin', st.skin);
    document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed', b.dataset.s===st.skin));
    main.classList.toggle('list', st.lay==='list');
    document.querySelectorAll('#lay button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===st.lay));
    document.querySelectorAll('#ver button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===st.ver));
    render();
  };

  document.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>{st.skin=b.dataset.s;store.set('skin',st.skin);apply()}));
  document.querySelectorAll('#lay button').forEach(b=>b.addEventListener('click',()=>{st.lay=b.dataset.v;store.set('lay',st.lay);apply()}));
  document.querySelectorAll('#ver button').forEach(b=>b.addEventListener('click',()=>{st.ver=b.dataset.v;apply()}));
  document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value;render()});
  apply();
}
</script>
</body>
</html>
