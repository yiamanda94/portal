<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>通路管理工具入口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 工作用入口頁，清楚、正式、主管一眼就懂
   IDEA: 車站的路線時刻牌——每個網頁是一條路線，點了就走
   PICTURE: 三張大型路線牌卡片，各有一個代表圖示
   COLOUR and TYPE: 白底、黑字、號誌紅點綴；Noto Sans TC
   LAYOUT: 粗頂線＋標題，下方卡片格線，手機改單欄 */
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#0e0e0e);
  --ink:light-dark(#111111,#f2f2f2);
  --mute:light-dark(#5c5c5c,#a8a8a8);
  --line:light-dark(#e3e3e3,#2a2a2a);
  --card:light-dark(#ffffff,#161616);
  --soft:light-dark(#f5f5f5,#1c1c1c);
  --red:#e4002b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px);max-width:1240px;margin:0 auto}
header.band{border-top:10px solid var(--ink);padding-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);font-weight:500}
.tag i{width:10px;height:10px;background:var(--red);border-radius:50%}
h1{font-size:clamp(32px,5vw,48px);line-height:1.1;margin:10px 0 8px;font-weight:900;text-wrap:balance}
.lead{color:var(--mute);margin:0;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px;padding-top:20px}
a.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s;min-height:100%}
a.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(0,0,0,.25);border-color:var(--ink)}
a.card:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.art{background:var(--soft);height:150px;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.art svg{width:120px;height:120px}
.body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{font-size:22px;line-height:1.3;margin:0;font-weight:700}
.ver{font-style:normal;font-size:13px;font-weight:700;color:var(--red);border:1.5px solid var(--red);border-radius:6px;padding:1px 8px;vertical-align:4px;white-space:nowrap}
.body p{margin:0;color:var(--mute);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips span{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ink)}
.go{margin-top:auto;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line)}
.go small{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.go b{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px;border-radius:10px;background:var(--red);color:#fff;font-weight:700;font-size:15px}
footer.band{color:var(--mute);font-size:13px;padding-top:8px}
@media(prefers-reduced-motion:reduce){a.card{transition:none}a.card:hover{transform:none}}
</style>
</head>
<body>
<header class="band">
  <span class="tag"><i></i>主管檢視專用</span>
  <h1>通路管理工具入口</h1>
  <p class="lead">點選下方卡片，即可開啟各項報表與分析網頁（會另開新分頁）。</p>
</header>

<main class="band" style="padding-top:0">
  <div class="grid" id="grid"></div>
</main>

<footer class="band">更新日期：2026-11-23</footer>

<script>
{
  const icons = {
    chart:`<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="14" y="96" width="92" height="4" rx="2" fill="currentColor" opacity=".25"/><rect x="22" y="60" width="16" height="36" rx="3" fill="currentColor" opacity=".35"/><rect x="44" y="40" width="16" height="56" rx="3" fill="currentColor" opacity=".55"/><rect x="66" y="50" width="16" height="46" rx="3" fill="currentColor" opacity=".35"/><rect x="88" y="22" width="16" height="74" rx="3" fill="#e4002b"/><path d="M26 50 L52 30 L74 40 L96 14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    shelf:`<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="16" y="18" width="88" height="84" rx="6" fill="none" stroke="currentColor" stroke-width="4" opacity=".5"/><rect x="16" y="56" width="88" height="4" fill="currentColor" opacity=".5"/><rect x="26" y="30" width="12" height="26" rx="3" fill="currentColor" opacity=".45"/><rect x="42" y="34" width="12" height="22" rx="3" fill="currentColor" opacity=".45"/><rect x="58" y="28" width="12" height="28" rx="3" fill="#e4002b"/><rect x="26" y="70" width="14" height="28" rx="3" fill="currentColor" opacity=".35"/><rect x="44" y="74" width="14" height="24" rx="3" fill="currentColor" opacity=".35"/><circle cx="86" cy="80" r="13" fill="#e4002b"/><path d="M80 80 l4 4 l8 -8" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    map:`<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M14 30 L44 20 L76 30 L106 20 L106 92 L76 102 L44 92 L14 102 Z" fill="currentColor" opacity=".15"/><path d="M44 20 L44 92 M76 30 L76 102" stroke="currentColor" stroke-width="3" opacity=".35"/><circle cx="32" cy="70" r="5" fill="currentColor" opacity=".5"/><circle cx="90" cy="76" r="5" fill="currentColor" opacity=".5"/><path d="M60 82 C60 82 40 60 40 46 a20 20 0 0 1 40 0 C80 60 60 82 60 82 Z" fill="#e4002b"/><circle cx="60" cy="46" r="7" fill="#fff"/></svg>`,
    people:`<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="40" cy="40" r="12" fill="currentColor" opacity=".45"/><path d="M18 84 a22 22 0 0 1 44 0 z" fill="currentColor" opacity=".45"/><circle cx="76" cy="36" r="14" fill="#e4002b"/><path d="M50 88 a26 26 0 0 1 52 0 z" fill="#e4002b"/><rect x="14" y="96" width="92" height="4" rx="2" fill="currentColor" opacity=".25"/></svg>`
  };

  const links = [
    { title:'傳統通路戰情表', desc:'傳統通路業務戰情，掌握各項促案與陳列執行進度。',
      chips:['店家查詢','菸架購貨','啤酒五大陳列','酒特陳架','全品項業績'],
      url:'https://yiamanda94.github.io/NBCRTI/', icon:'chart' },
    { title:'全聯A級點每週巡補回報', desc:'全聯 A 級門市每週巡補拜訪與照片回報。',
      chips:['全聯','A級點','每週回報'],
      url:'https://yiamanda94.github.io/PX-A-Wkly-Visit-Rpt/', icon:'shelf' },
    { title:'人力配置 × 勞役比分析', desc:'各營業所人力配置與勞役比分析（主管檢視版）。',
      chips:['人力配置','勞役比','營業所'],
      url:'https://yiamanda94.github.io/staffing-report/', icon:'people', label:'網頁版' },
    { title:'通路分布地圖', desc:'北部營業處店家分布地圖，可依通路、地區、駐點、品項篩選。',
      chips:['通路','地區','駐點','品項'],
      url:'https://bright-licorice-3c5ece.netlify.app/', icon:'map', label:'手機APP版' }
  ];

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.getElementById('grid').innerHTML = links.map(l => `
    <a class="card" href="${esc(l.url)}" target="_blank" rel="noopener">
      <div class="art">${icons[l.icon]}</div>
      <div class="body">
        <h2>${esc(l.title)}${l.label?` <em class="ver">${esc(l.label)}</em>`:''}</h2>
        <p>${esc(l.desc)}</p>
        <div class="chips">${l.chips.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
        <div class="go"><small>${esc(l.url.replace('https://',''))}</small><b>開啟 →</b></div>
      </div>
    </a>`).join('');
}
</script>
</body>
</html>
